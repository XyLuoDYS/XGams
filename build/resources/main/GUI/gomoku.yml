# 字体命名空间，如果你不使用原版的字体图片，而是使用ce的图像之类的，那么可以忽略
Font:
  namespace: "xgams:gomoku"

# 负空格，介于每列之间
Texture:
  enabled: false
  negative-space: "\uE010"

# 界面的一些参数
Dialog:
  # 标题（支持颜色代码）
  title: "&6五子棋"
  # 五子棋组件的宽度
  width: 400
  size-big:
    # 第四行与按钮之间的空格数量
    button-spacing: 5
    # 第七行与游戏结束消息之间的空格数量
    message-spacing: 5
    # 游戏结束前，第七行末尾的空格数量
    message-row-spacing: 5
    # 非第四行与第七行的行末尾空格数量
    other-spacing: 5
  size-small:
    button-spacing: 5
    message-spacing: 5
    message-row-spacing: 5
    other-spacing: 5
  # 五子连珠动画：每颗棋子标记之间的延迟（ticks，1秒=20ticks）
  win-mark-delay: 2
  # 五子全部标记后，到显示游戏结束消息的延迟（ticks，1秒=20ticks）
  win-message-delay: 10

Messages:
  # 单元格悬浮提示
  cell-hover: "第{row}行 第{col}列"
  # 切换棋盘尺寸的按钮悬浮提示
  toggle-hover: "点击切换棋盘大小"

# 游戏结束消息（显示在棋盘第七行末尾）
GameOver:
  size-big:
    # 您获胜时显示的消息
    win-you: "&a您成功获胜"
    # 对方获胜时显示的消息
    win-opponent: "&c对方成功获胜"
    # 平局时显示的消息
    draw: "&e平局"
  size-small:
    win-you: "&a您成功获胜"
    win-opponent: "&c对方成功获胜"
    draw: "&e平局"

# 按钮配置
Button:
  size-change:
    size-big:
      display: "&e[切换紧凑棋盘]"
      action:
        - "change: small"
    size-small:
      display: "&e[切换宽松棋盘]"
      action:
        - "change: big"

# 音效配置
Sound:
  # 落子音效
  place:
    - "block.stone.place"
  # 落子音效音调调节
  place-pitch:
    # 开关
    enabled: false
    # 音调列表
    pitches:
      - 0.8
      - 1.0
      - 1.2
  # 连珠获胜动画音效
  win-mark:
    - "block.note_block.pling"
